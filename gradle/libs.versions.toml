[versions]
agp                 = "9.2.0"
kotlin              = "2.3.21"
coreKtx             = "1.18.0"
appcompat           = "1.7.1"
activityKtx         = "1.13.0"
fragmentKtx         = "1.8.9"
lifecycleKtx        = "2.10.0"
navigationKtx       = "2.9.8"
coroutines          = "1.10.2"
material            = "1.13.0"
constraintlayout    = "2.2.1"

[libraries]
androidx-core-ktx               = { group = "androidx.core",               name = "core-ktx",                   version.ref = "coreKtx"          }
androidx-appcompat               = { group = "androidx.appcompat",          name = "appcompat",                   version.ref = "appcompat"         }
androidx-activity-ktx            = { group = "androidx.activity",           name = "activity-ktx",                version.ref = "activityKtx"       }
androidx-fragment-ktx            = { group = "androidx.fragment",           name = "fragment-ktx",                version.ref = "fragmentKtx"       }
androidx-constraintlayout        = { group = "androidx.constraintlayout",   name = "constraintlayout",            version.ref = "constraintlayout"  }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx",     version.ref = "lifecycleKtx"      }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",       version.ref = "lifecycleKtx"      }
androidx-navigation-fragment-ktx = { group = "androidx.navigation",         name = "navigation-fragment-ktx",     version.ref = "navigationKtx"     }
androidx-navigation-ui-ktx       = { group = "androidx.navigation",         name = "navigation-ui-ktx",           version.ref = "navigationKtx"     }
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",  version.ref = "coroutines"        }
kotlinx-coroutines-core          = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",     version.ref = "coroutines"        }
material                         = { group = "com.google.android.material",  name = "material",                   version.ref = "material"          }

[plugins]
android-application  = { id = "com.android.application",             version.ref = "agp"           }
# kotlin-android intentionally omitted — AGP 9.0+ applies Kotlin automatically.
# Declaring AND applying it causes: "plugin is no longer required" fatal error.
navigation-safeargs  = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigationKtx" }
